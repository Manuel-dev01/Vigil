name: CI

on:
  push:
  pull_request:

# Read-only: CI checks code and never writes to the repository. No secrets are used.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript (typecheck, vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the pnpm version named in package.json `packageManager`.
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r --if-present typecheck

      # The only suite that talks to the network is packages/chain-ws/test/live.test.ts, which runs only
      # when VIGIL_LIVE=1. It is pinned off here so CI never depends on the testnet.
      - name: Vitest
        run: pnpm vitest run
        env:
          VIGIL_LIVE: "0"

      # The web app bundles workspace packages for the browser. If one of them pulls in a Node module
      # (fs, path, url…), Vite replaces it with an empty stand-in and only warns, and the page breaks
      # at run time. Treat that warning as a failure.
      - name: Web build (no Node modules in the browser bundle)
        run: |
          pnpm --filter @vigil/web build 2>&1 | tee web-build.log
          if grep -q "externalized for browser compatibility" web-build.log; then
            echo "::error::A Node module reached the web bundle:"
            grep "externalized for browser compatibility" web-build.log
            exit 1
          fi

      # The browser watchtower's Web Worker is built with side-effect-free tree-shaking (vite.config.ts).
      # Run the built file on recorded chain data, so a shaken-out dependency fails here, not in a visitor's tab.
      - name: Browser watchtower worker (built file, recorded data)
        run: pnpm --filter @vigil/web smoke:worker

  # QoreScan's cryptographic inventory of the contracts, and a gate on it: CI fails if any contract verifies a
  # classical signature (ecrecover, ECDSA, P-256 or RSA, or imports a library that provides one). Only the
  # Solidity scan gates; the network scans (accounts, TLS) run in cbom-network.yml and never block.
  cbom:
    name: CBOM gate (QoreScan, contracts)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # @qorechain/qorescan 0.1.0 comes from the lockfile. Its launcher downloads the release binary and runs it
      # only if the SHA-256 matches the digest shipped in the package. The Solidity scan reads files, nothing else.
      - name: Scan the contracts
        run: pnpm exec qorescan solidity contracts/src --out "$RUNNER_TEMP/contracts.cdx.json"

      - name: Gate (no classical signature verification in the contracts)
        run: pnpm cbom:gate "$RUNNER_TEMP/contracts.cdx.json"

      # The gate must still catch a real ecrecover (exit 1, not 2: a broken scan is not a catch), and must pass
      # ECDSA and ecrecover named only in comments and strings, as in PQGuardVault's doc comment.
      - name: Gate self-test (canaries)
        run: |
          pnpm exec qorescan solidity test/vectors/cbom/classical --out "$RUNNER_TEMP/classical.cdx.json"
          set +e
          GITHUB_ACTIONS= pnpm -s cbom:gate "$RUNNER_TEMP/classical.cdx.json"
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "::error::The gate did not fail the ecrecover canary (exit $code)."
            exit 1
          fi
          echo "The ecrecover canary failed the gate, as it must."
          pnpm exec qorescan solidity test/vectors/cbom/comments --out "$RUNNER_TEMP/comments.cdx.json"
          pnpm -s cbom:gate "$RUNNER_TEMP/comments.cdx.json"

      - name: Summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/contracts.cdx.json" ]; then
            pnpm -s cbom:summary "$RUNNER_TEMP/contracts.cdx.json" >> "$GITHUB_STEP_SUMMARY"
          fi

  contracts:
    name: Contracts (forge test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout (with forge-std)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: v1.8.3

      - name: Forge version
        run: forge --version

      - name: Forge test
        working-directory: contracts
        run: forge test
