name: CI

on:
  push:
  pull_request:

# Read-only: CI checks code and never writes to the repository. No secrets are used.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript (typecheck, vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the pnpm version named in package.json `packageManager`.
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r --if-present typecheck

      # The only suite that talks to the network is packages/chain-ws/test/live.test.ts, which runs only
      # when VIGIL_LIVE=1. It is pinned off here so CI never depends on the testnet.
      - name: Vitest
        run: pnpm vitest run
        env:
          VIGIL_LIVE: "0"

  contracts:
    name: Contracts (forge test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout (with forge-std)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: v1.8.3

      - name: Forge version
        run: forge --version

      - name: Forge test
        working-directory: contracts
        run: forge test
