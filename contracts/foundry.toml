[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
cbor_metadata = false
# Tests read recorded chain data (anchor vectors) from the repo's test/vectors.
fs_permissions = [{ access = "read", path = "../test/vectors" }]

[fmt]
line_length = 110
